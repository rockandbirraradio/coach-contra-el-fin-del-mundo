name: Recover verified V23.2 game backup
on:
  push:
    branches:
      - backup/v23.1-beta-20-misiones
    paths:
      - 'releases/v23.2/parts/**'
      - 'releases/v23.2/restore.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and validate SHA-256
        run: python3 releases/v23.2/restore.py
      - name: Commit verified playable HTML only in backup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/v23.2/Coach_20_Misiones_V23_2_Estabilizacion.html
          git diff --cached --quiet || git commit -m 'backup: restore verified V23.2 playable 20-mission HTML'
          git push origin HEAD:backup/v23.1-beta-20-misiones
